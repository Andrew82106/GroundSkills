<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Blueprint structure diagram</title>
  <desc id="desc">A Swiss-style chain showing overview, node, scene, and component blocks.</desc>
  <rect width="1200" height="500" fill="#fafaf8"/>
  <g stroke="#d4d4d2" stroke-width="1">
    <path d="M0 50h1200M0 100h1200M0 150h1200M0 200h1200M0 250h1200M0 300h1200M0 350h1200M0 400h1200M0 450h1200"/>
    <path d="M50 0v500M100 0v500M150 0v500M200 0v500M250 0v500M300 0v500M350 0v500M400 0v500M450 0v500M500 0v500M550 0v500M600 0v500M650 0v500M700 0v500M750 0v500M800 0v500M850 0v500M900 0v500M950 0v500M1000 0v500M1050 0v500M1100 0v500M1150 0v500"/>
  </g>
  <g fill="none" stroke="#002fa7" stroke-width="8">
    <path d="M245 250h105M545 250h105M845 250h105"/>
  </g>
  <g fill="#002fa7">
    <path d="M350 250l-22-14v28zM650 250l-22-14v28zM950 250l-22-14v28z"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="34" font-weight="700" text-anchor="middle">
    <g>
      <rect x="55" y="155" width="190" height="190" fill="#0a0a0a"/>
      <text x="150" y="242" fill="#fafaf8">OVERVIEW</text>
      <text x="150" y="285" fill="#fafaf8">全局结构</text>
    </g>
    <g>
      <rect x="355" y="155" width="190" height="190" fill="#fafaf8" stroke="#0a0a0a" stroke-width="4"/>
      <text x="450" y="242" fill="#0a0a0a">NODE</text>
      <text x="450" y="285" fill="#0a0a0a">节点概览</text>
    </g>
    <g>
      <rect x="655" y="155" width="190" height="190" fill="#002fa7"/>
      <text x="750" y="242" fill="#ffffff">SCENE</text>
      <text x="750" y="285" fill="#ffffff">局部场景</text>
    </g>
    <g>
      <rect x="955" y="155" width="190" height="190" fill="#fafaf8" stroke="#0a0a0a" stroke-width="4"/>
      <text x="1050" y="242" fill="#0a0a0a">BLOCK</text>
      <text x="1050" y="285" fill="#0a0a0a">证据组件</text>
    </g>
  </g>
</svg>
